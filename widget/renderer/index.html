<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Student Twin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- No title= attributes anywhere: native tooltips are separate OS windows that can escape
       content protection and show up in the twin's own screenshots. -->
  <div class="panel">
    <header class="header">
      <span id="dot" class="dot idle starting" role="status" aria-label="Idle"></span>
      <button id="hide" class="icon-btn" aria-label="Hide">&#x2014;</button>
    </header>
    <div id="meter" class="meter" aria-hidden="true"><span></span></div>

    <main id="conversation" class="conversation" aria-live="polite"></main>

    <footer class="input-bar">
      <textarea id="input" rows="1" placeholder="Type a request" aria-label="Type a request"></textarea>
    </footer>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
